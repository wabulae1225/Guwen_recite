<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学速算</title>

<link rel="manifest" href="../manifest.webmanifest">

<!-- 题目生成器，必须和本文件放在同一个目录里 -->
<script src="engine.js"></script>

<style>
:root{
  --paper:#E8EBE6; --paper-card:#F3F5F1;
  --ink:#23241F; --ink-soft:#6A6E66; --ink-faint:#9BA096;
  --rule:#C6CABF; --cinnabar:#9E2B25; --cinnabar-soft:#C4726C;
  --moss:#3F6B52; --gold:#8A6A1F;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --mono:"SF Mono","Menlo","Consolas","Noto Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:740px;margin:0 auto;padding:24px 18px 70px}

header{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.seal{width:32px;height:32px;flex:none;background:var(--cinnabar);color:#F3F5F1;
  font-family:var(--serif);font-size:19px;line-height:32px;text-align:center;border-radius:2px}
h1{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:.08em}
header .back{margin-left:auto;font-size:12.5px;color:var(--ink-soft);text-decoration:none}
header .back:hover{color:var(--cinnabar)}

/* 大类：十个，窄屏横向滚动 */
.cats{display:flex;border:1px solid var(--rule);border-radius:3px;margin-bottom:12px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.cats button{flex:0 0 auto;background:var(--paper-card);border:none;
  border-right:1px solid var(--rule);padding:11px 13px;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--ink-soft);white-space:nowrap}
.cats button:last-child{border-right:none}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--paper-card)}
.cats button[disabled]{color:var(--ink-faint);cursor:default;opacity:.6}
.cats button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:-3px}

.opts{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;
  padding:13px 15px;margin-bottom:16px}
.optrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink-soft)}
select{background:#fff;border:1px solid var(--rule);border-radius:2px;padding:6px 8px;
  font-family:inherit;font-size:14px;color:var(--ink);min-width:104px}
.optrow .spacer{flex:1}
.linkbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;font-size:13px;font-family:inherit;padding:5px 0}
.linkbtn:hover{color:var(--cinnabar)}
.picker{margin-top:12px;border-top:1px solid var(--rule);padding-top:11px;
  display:flex;align-items:center;gap:11px}
.picker .now{font-size:12.5px;color:var(--ink-soft);flex:1}

.btn{background:var(--paper-card);border:1px solid var(--rule);border-radius:2px;
  padding:8px 14px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.btn:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}

/* 浮层 */
.overlay{position:fixed;inset:0;background:rgba(35,36,31,.42);z-index:20;
  display:flex;align-items:center;justify-content:center;padding:18px}
.overlay[hidden]{display:none}   /* display:flex 会盖掉 hidden，得明写一条 */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:3px;
  width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column}
.sheet .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 15px;border-bottom:1px solid var(--rule)}
.sheet .head b{font-family:var(--serif);font-size:16px;letter-spacing:.05em}
.sheet .body{overflow-y:auto;padding:6px 0}
.subrow{display:flex;align-items:center;gap:9px;padding:9px 15px;cursor:pointer;
  border-bottom:1px solid rgba(198,202,191,.45);font-size:14px}
.subrow:last-child{border-bottom:none}
.subrow:hover{background:var(--paper-card)}
.subrow input{margin:0;flex:none}

/* 题卡 */
.card{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;
  padding:22px 20px;min-height:170px}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-faint);
  margin-bottom:14px}
.meta .where{color:var(--ink-soft)}
.meta .clock{margin-left:auto;font-family:var(--mono);font-size:12px}
.q{font-size:25px;line-height:1.5;font-family:var(--serif);letter-spacing:.02em;
  word-break:break-word}
.q sup{font-size:.62em}
.ans{margin-top:18px;border-top:1px dashed var(--rule);padding-top:15px}
.ans .lab{font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;margin-bottom:6px}
.ans .val{font-size:23px;font-family:var(--serif);color:var(--cinnabar);line-height:1.5;
  word-break:break-word}
.ans .val sup{font-size:.62em}
.ans .note{margin-top:11px;font-size:13px;color:var(--ink-soft);line-height:1.65}

.judge{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.judge button{flex:1;min-width:104px;padding:11px 8px;border-radius:2px;cursor:pointer;
  font-family:inherit;font-size:14px;border:1px solid var(--rule);background:#fff}
.judge .ok{color:var(--moss)}      .judge .ok:hover{border-color:var(--moss);background:#F0F5F1}
.judge .bad{color:var(--cinnabar)} .judge .bad:hover{border-color:var(--cinnabar);background:#F8F0EF}
.judge .non{color:var(--ink-soft)} .judge .non:hover{border-color:var(--ink-soft)}
.judge button kbd{font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:2px;padding:0 4px;margin-left:5px}

.mywrong{margin-top:14px;background:#fff;border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px}
.mywrong .t{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px}
.mywrong .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mywrong input{flex:1;min-width:150px;background:#fff;border:1px solid var(--rule);
  border-radius:2px;padding:8px 10px;font-family:var(--serif);font-size:16px;color:var(--ink)}
.mywrong input:focus{outline:2px solid var(--cinnabar-soft);outline-offset:-1px}

.go{margin-top:14px;display:flex;align-items:center;gap:12px}
.go .hint{font-size:12px;color:var(--ink-faint)}

/* 结束页 */
.done{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;padding:24px 20px}
.done h2{font-family:var(--serif);font-size:19px;margin:0 0 16px;letter-spacing:.06em}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:88px;background:#fff;border:1px solid var(--rule);border-radius:2px;
  padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:23px;line-height:1.3}
.stat span{font-size:11.5px;color:var(--ink-faint)}
.stat.g b{color:var(--moss)} .stat.r b{color:var(--cinnabar)}

/* 错题本 */
.wlist{max-height:none}
.witem{border-bottom:1px solid var(--rule);padding:11px 15px;font-size:14px}
.witem:last-child{border-bottom:none}
.witem .wq{font-family:var(--serif);font-size:16px}
.witem .wa{color:var(--cinnabar);font-size:13.5px;margin-top:3px}
.witem .wmy{color:var(--ink-soft);font-size:12.5px;margin-top:3px}
.witem .wfoot{display:flex;align-items:center;gap:10px;margin-top:6px;
  font-size:11.5px;color:var(--ink-faint)}
.witem .wfoot .linkbtn{font-size:11.5px;padding:0}
.empty{padding:26px 15px;text-align:center;color:var(--ink-faint);font-size:13.5px}
textarea{width:100%;height:110px;background:#fff;border:1px solid var(--rule);
  border-radius:2px;padding:9px;font-family:var(--mono);font-size:12px;color:var(--ink)}

.fatal{background:#F8F0EF;border:1px solid var(--cinnabar-soft);border-radius:3px;
  padding:16px;color:var(--ink);line-height:1.8}

@media(max-width:430px){
  .wrap{padding:18px 14px 50px}
  .q{font-size:22px}
  .ans .val{font-size:20px}
  .judge button{min-width:0;font-size:13px;padding:11px 4px}
  .judge button kbd{display:none}
}
</style>

<div class="wrap">
  <header>
    <div class="seal">算</div>
    <h1>数学速算</h1>
    <a class="back" href="../index.html">← 换一科</a>
  </header>

  <div id="app"></div>
</div>

<script>
/* ============================================================
   数学速算页面

   和语文页面的根本区别：没有题库。题目由 engine.js 现场生成，
   所以这里只存错题（题面 + 答案 + 你填的错答），不存题库。

   「只练错过的」是把存下来的错题原样重现，不是重新生成同型题。
   （参数化重现留作以后的方向，见 LOG。）
   ============================================================ */
"use strict";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

if(!window.MATH){
  $("app").innerHTML =
    '<div class="fatal"><b>没读到 engine.js。</b><br>'+
    '请确认 <code>engine.js</code> 和本文件放在<b>同一个目录</b>里。</div>';
  throw new Error("engine.js missing");
}

/* ---------- 存储：只存错题 ---------- */

const KEY = "math_wrong_v1";
const store = {
  get(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  },
  set(v){
    try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){}
  }
};

/* 错题一条：{cat,sub,catName,subName,q,a,note,my,kind,n,t}
   kind: "bad" 算错了 / "non" 没算出来
   my:   我算成了几（可空）
   n:    错过几次   t: 最后一次的时间戳        */
let wrong = store.get();

function wrongKey(it){ return it.cat + "|" + it.sub + "|" + it.q; }

function recordWrong(q, kind, my){
  const k = wrongKey(q);
  const old = wrong.find(w => wrongKey(w) === k);
  if(old){
    old.n += 1; old.t = Date.now(); old.kind = kind;
    if(my) old.my = my;
  }else{
    wrong.push({ cat:q.cat, sub:q.sub, catName:q.catName, subName:q.subName,
                 q:q.q, a:q.a, note:q.note || "", my: my || "",
                 kind: kind, n:1, t:Date.now() });
  }
  store.set(wrong);
}

/* ---------- 状态 ---------- */

const CATS = window.MATH.cats;
let cat = CATS[0];                 // 当前大类
let chosen = new Set();            // 当前大类里选中的细类 id
let queue = [], pos = 0, shown = false;
let onlyWrong = false;             // 筛选：只练错过的
let amount = 20;                   // 题量

let tStart = 0, tQ = 0, tSpent = 0;   // 全轮起点 / 本题起点 / 本题用时
let tally = { ok:0, bad:0, non:0, total:0 };
let judged = null;                 // 本题已判的档位（等着填错答）

function selectAllSubs(){
  chosen = new Set(cat.subs.map(s => s.id));
}
selectAllSubs();

/* ---------- 出题 ---------- */

function buildQueue(){
  queue = []; pos = 0; shown = false; judged = null;
  tally = { ok:0, bad:0, non:0, total:0 };

  if(onlyWrong){
    /* 错题原样重现，不重新生成 */
    const pool = wrong.filter(w => w.cat === cat.id && chosen.has(w.sub));
    shuffle(pool);
    queue = pool.slice(0, amount || pool.length).map(w => ({
      cat:w.cat, sub:w.sub, catName:w.catName, subName:w.subName,
      q:w.q, a:w.a, note:w.note, redo:true
    }));
  }else{
    const subs = cat.subs.filter(s => chosen.has(s.id));
    if(!subs.length){ render(); return; }   /* 一个细类都没选：也要重画，好把提示显出来 */
    const n = amount || 20;
    for(let i = 0; i < n; i++){
      const s = subs[i % subs.length];
      const made = s.gen();
      queue.push({ cat:cat.id, sub:s.id, catName:cat.name, subName:s.name,
                   q:made.q, a:made.a, note:made.note || "" });
    }
    shuffle(queue);
  }
  tStart = Date.now();
  render();
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

function fmtSec(ms){
  const s = Math.round(ms / 100) / 10;
  return s < 60 ? s.toFixed(1) + " 秒"
                : Math.floor(s/60) + " 分 " + Math.round(s % 60) + " 秒";
}

/* ---------- 渲染 ---------- */

function render(){
  const built = cat.subs.length > 0;

  let head = ''
    + '<div class="cats">' + CATS.map(c =>
        '<button data-c="' + c.id + '" aria-pressed="' + (c.id === cat.id) + '"'
        + (c.subs.length ? '' : ' disabled title="还没建"') + '>'
        + esc(c.name) + (c.subs.length ? '' : '·待建') + '</button>').join("")
    + '</div>'
    + '<div class="opts">'
    +   '<div class="optrow">'
    +     '<div class="field"><label for="amount">题量</label>'
    +       '<select id="amount">'
    +         [10,20,30,50].map(n =>
                '<option value="'+n+'"'+(n===amount?' selected':'')+'>'+n+' 题</option>').join("")
    +       '</select></div>'
    +     '<div class="field"><label for="filter">筛选</label>'
    +       '<select id="filter">'
    +         '<option value="all"'+(onlyWrong?'':' selected')+'>不筛选</option>'
    +         '<option value="wrong"'+(onlyWrong?' selected':'')+'>只练错过的</option>'
    +       '</select></div>'
    +     '<div class="spacer"></div>'
    +     '<button class="linkbtn" id="openWrong">我的错题（' + wrong.length + '）</button>'
    +   '</div>'
    +   '<div class="picker">'
    +     '<button class="btn" id="openPicker"' + (built?'':' disabled') + '>细类</button>'
    +     '<span class="now">' + subsLabel() + '</span>'
    +     '<button class="btn" id="restart">换一轮</button>'
    +   '</div>'
    + '</div>';

  let body;
  if(!built){
    body = '<div class="card"><div class="empty">'
         + esc(cat.name) + '这一类还没建。<br>已经能练的是「数字计算」和「三角计算」。'
         + '</div></div>';
  }else if(!queue.length){
    body = '<div class="card"><div class="empty">'
         + (onlyWrong ? '这一类还没有错题。把筛选切回「不筛选」就能出题。'
                      : '一个细类都没选，点上面的「细类」挑几个。')
         + '</div></div>';
  }else if(pos >= queue.length){
    body = renderDone();
  }else{
    body = renderCard();
  }

  $("app").innerHTML = head + body;
  bind();
}

function subsLabel(){
  if(!cat.subs.length) return "——";
  const n = chosen.size, all = cat.subs.length;
  if(n === all) return "全部 " + all + " 个细类";
  if(n === 0)   return "一个都没选";
  if(n <= 3)    return cat.subs.filter(s => chosen.has(s.id)).map(s => s.name).join("、");
  return "选了 " + n + " / " + all + " 个细类";
}

function renderCard(){
  const q = queue[pos];
  let h = '<div class="card">'
    + '<div class="meta"><span class="where">' + esc(q.subName) + '</span>'
    +   '<span>' + (pos + 1) + ' / ' + queue.length + '</span>'
    +   (q.redo ? '<span>重做</span>' : '')
    +   '<span class="clock" id="clock">0.0 秒</span></div>'
    + '<div class="q">' + q.q + '</div>';

  if(shown){
    h += '<div class="ans"><div class="lab">答案</div>'
       + '<div class="val">' + q.a + '</div>'
       + (q.note ? '<div class="note">' + q.note + '</div>' : '')
       + '</div>';

    if(judged === null){
      h += '<div class="judge">'
         + '<button class="ok"  data-j="ok">算对了<kbd>1</kbd></button>'
         + '<button class="bad" data-j="bad">算错了<kbd>2</kbd></button>'
         + '<button class="non" data-j="non">没算出来<kbd>3</kbd></button>'
         + '</div>';
    }else if(judged === "bad"){
      h += '<div class="mywrong">'
         + '<div class="t">算成了几？填了下次能对照——<b>可以不填</b>，打不出来就直接下一题。</div>'
         + '<div class="row">'
         +   '<input id="myans" placeholder="我算成了…" autocomplete="off">'
         +   '<button class="btn" id="next">下一题</button>'
         + '</div></div>';
    }
    if(judged && judged !== "bad"){
      h += '<div class="go"><button class="btn" id="next">下一题</button>'
         + '<span class="hint">空格继续</span></div>';
    }
  }else{
    h += '<div class="go"><button class="btn" id="reveal">看答案</button>'
       + '<span class="hint">空格看答案</span></div>';
  }
  return h + '</div>';
}

function renderDone(){
  const total = tally.total || 1;
  const spent = Date.now() - tStart;
  return '<div class="done">'
    + '<h2>这一轮做完了</h2>'
    + '<div class="stats">'
    +   '<div class="stat g"><b>' + tally.ok  + '</b><span>算对了</span></div>'
    +   '<div class="stat r"><b>' + tally.bad + '</b><span>算错了</span></div>'
    +   '<div class="stat"><b>'   + tally.non + '</b><span>没算出来</span></div>'
    +   '<div class="stat"><b>'   + Math.round(tally.ok / total * 100) + '%</b><span>正确率</span></div>'
    + '</div>'
    + '<div class="stats">'
    +   '<div class="stat"><b>' + fmtSec(spent) + '</b><span>总时长</span></div>'
    +   '<div class="stat"><b>' + fmtSec(spent / total) + '</b><span>平均每题</span></div>'
    + '</div>'
    + '<div class="go"><button class="btn" id="restart2">再来一轮</button>'
    +   '<button class="btn" id="openWrong2">我的错题（' + wrong.length + '）</button>'
    +   '<span class="hint">空格再来一轮</span></div>'
    + '</div>';
}

/* 秒表：每题从出现开始跑，看答案时停 */
let clockTimer = null;
function startClock(){
  stopClock();
  tQ = Date.now();
  clockTimer = setInterval(() => {
    const el = $("clock");
    if(el) el.textContent = fmtSec(Date.now() - tQ);
  }, 100);
}
function stopClock(){
  if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
}

/* ---------- 交互 ---------- */

function reveal(){
  if(shown) return;
  tSpent = Date.now() - tQ;
  stopClock();
  shown = true;
  render();
  const el = $("clock");
  if(el) el.textContent = fmtSec(tSpent);
}

function judge(kind){
  if(!shown || judged) return;
  judged = kind;
  tally[kind] += 1; tally.total += 1;
  if(kind === "bad"){
    render();                       /* 出输入框，等你填或直接下一题 */
    const el = $("myans"); if(el) el.focus();
  }else{
    if(kind === "non") recordWrong(queue[pos], "non", "");
    render();
  }
}

function next(){
  if(judged === "bad"){
    const el = $("myans");
    recordWrong(queue[pos], "bad", el ? el.value.trim() : "");
  }
  pos += 1; shown = false; judged = null;
  render();
}

function bind(){
  document.querySelectorAll(".cats button[data-c]").forEach(b => {
    b.onclick = () => {
      cat = CATS.find(c => c.id === b.dataset.c);
      selectAllSubs();
      buildQueue();
    };
  });

  const am = $("amount");
  if(am) am.onchange = () => { amount = +am.value; buildQueue(); };

  const fi = $("filter");
  if(fi) fi.onchange = () => { onlyWrong = fi.value === "wrong"; buildQueue(); };

  const op = $("openPicker"); if(op) op.onclick = openPicker;
  const ow = $("openWrong");  if(ow) ow.onclick = openWrong;
  const ow2 = $("openWrong2");if(ow2) ow2.onclick = openWrong;
  const rs = $("restart");    if(rs) rs.onclick = buildQueue;
  const rs2 = $("restart2");  if(rs2) rs2.onclick = buildQueue;

  const rv = $("reveal"); if(rv) rv.onclick = reveal;
  const nx = $("next");   if(nx) nx.onclick = next;
  document.querySelectorAll(".judge button[data-j]").forEach(b => {
    b.onclick = () => judge(b.dataset.j);
  });

  if(!shown && queue.length && pos < queue.length) startClock();
}

document.addEventListener("keydown", e => {
  if(document.querySelector(".overlay:not([hidden])")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea"){
    if(e.key === "Enter" && $("next")){ e.preventDefault(); next(); }
    return;
  }
  if(e.key === " "){
    e.preventDefault();
    if(pos >= queue.length && queue.length) buildQueue();
    else if(!shown) reveal();
    else if(judged) next();
  }
  if(shown && !judged){
    if(e.key === "1") judge("ok");
    if(e.key === "2") judge("bad");
    if(e.key === "3") judge("non");
  }
});

/* ---------- 细类浮层 ---------- */

function openPicker(){
  const rows = cat.subs.map(s =>
    '<label class="subrow"><input type="checkbox" data-s="' + s.id + '"'
    + (chosen.has(s.id) ? ' checked' : '') + '>' + esc(s.name) + '</label>').join("");

  overlay(
    '<b>' + esc(cat.name) + ' · 选细类</b>'
    + '<button class="linkbtn" id="sAll">全选</button>'
    + '<button class="linkbtn" id="sNone">全不选</button>'
    + '<button class="btn" id="sClose">完成</button>',
    '<div class="wlist">' + rows + '</div>',
    sheet => {
      sheet.querySelectorAll("input[data-s]").forEach(cb => {
        cb.onchange = () => {
          cb.checked ? chosen.add(cb.dataset.s) : chosen.delete(cb.dataset.s);
        };
      });
      sheet.querySelector("#sAll").onclick = () => {
        selectAllSubs();
        sheet.querySelectorAll("input[data-s]").forEach(cb => cb.checked = true);
      };
      sheet.querySelector("#sNone").onclick = () => {
        chosen.clear();
        sheet.querySelectorAll("input[data-s]").forEach(cb => cb.checked = false);
      };
      sheet.querySelector("#sClose").onclick = () => { closeOverlay(); buildQueue(); };
    });
}

/* ---------- 错题本 ---------- */

function openWrong(){
  const items = wrong.slice().sort((a,b) => b.t - a.t);
  const body = items.length
    ? '<div class="wlist">' + items.map((w,i) =>
        '<div class="witem">'
        + '<div class="wq">' + w.q + '</div>'
        + '<div class="wa">答案　' + w.a + '</div>'
        + (w.my ? '<div class="wmy">我算成了　' + esc(w.my) + '</div>' : '')
        + '<div class="wfoot">'
        +   '<span>' + esc(w.catName) + ' · ' + esc(w.subName) + '</span>'
        +   '<span>' + (w.kind === "non" ? "没算出来" : "算错了") + ' ' + w.n + ' 次</span>'
        +   '<button class="linkbtn" data-del="' + i + '">移出</button>'
        + '</div></div>').join("") + '</div>'
    : '<div class="empty">还没有错题。</div>';

  overlay(
    '<b>我的错题（' + wrong.length + '）</b>'
    + '<button class="linkbtn" id="wExport">导出</button>'
    + '<button class="linkbtn" id="wImport">导入</button>'
    + '<button class="linkbtn" id="wClear">清空</button>'
    + '<button class="btn" id="wClose">完成</button>',
    body,
    sheet => {
      sheet.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = () => {
          const w = items[+b.dataset.del];
          wrong = wrong.filter(x => wrongKey(x) !== wrongKey(w));
          store.set(wrong); closeOverlay(); openWrong();
        };
      });
      sheet.querySelector("#wClose").onclick = () => { closeOverlay(); render(); };
      sheet.querySelector("#wClear").onclick = () => {
        if(confirm("清空全部 " + wrong.length + " 条错题？不可撤销。")){
          wrong = []; store.set(wrong); closeOverlay(); render();
        }
      };
      sheet.querySelector("#wExport").onclick = () => {
        const blob = new Blob([JSON.stringify(wrong, null, 1)],
                              {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "math_wrong.json";
        a.click();
      };
      sheet.querySelector("#wImport").onclick = () => {
        closeOverlay();
        overlay('<b>导入错题</b><button class="btn" id="iClose">取消</button>',
          '<div style="padding:13px 15px">'
          + '<p style="margin:0 0 9px;font-size:13px;color:var(--ink-soft)">'
          + '把导出的 math_wrong.json 里的内容整段贴进来。</p>'
          + '<textarea id="ibox" placeholder="[ ... ]"></textarea>'
          + '<div class="go"><button class="btn" id="iDo">导入</button></div></div>',
          s2 => {
            s2.querySelector("#iClose").onclick = () => { closeOverlay(); render(); };
            s2.querySelector("#iDo").onclick = () => {
              try{
                const arr = JSON.parse(s2.querySelector("#ibox").value);
                if(!Array.isArray(arr)) throw new Error("不是数组");
                arr.forEach(it => {
                  if(!it || !it.q) return;
                  const k = wrongKey(it);
                  const old = wrong.find(x => wrongKey(x) === k);
                  if(old){ old.n += it.n || 1; if(it.my) old.my = it.my; }
                  else wrong.push(it);
                });
                store.set(wrong); closeOverlay(); render();
                alert("导入完成，现在共 " + wrong.length + " 条。");
              }catch(err){ alert("读不出来：" + err.message); }
            };
          });
      };
    });
}

/* ---------- 浮层底座 ---------- */

function overlay(headHTML, bodyHTML, after){
  closeOverlay();
  const el = document.createElement("div");
  el.className = "overlay";
  el.innerHTML = '<div class="sheet"><div class="head">' + headHTML + '</div>'
               + '<div class="body">' + bodyHTML + '</div></div>';
  document.body.appendChild(el);
  el.onclick = e => { if(e.target === el){ closeOverlay(); render(); } };
  if(after) after(el);
}
function closeOverlay(){
  document.querySelectorAll(".overlay").forEach(el => el.remove());
}

/* ---------- 起跑 ---------- */
buildQueue();
</script>
